<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { background-color: #ffff99; font-family: Verdana,sans-serif; }
</style>
<title>yorlink v0.1 - create post</title>
</head>
<body>
<h1>Create post</h1>
<em id="err"></em>
<p class="signout">
You need to sign in first.
<br>
<ul class="signout">
	<li><a href="login.html">Login</a></li>
	<li><a href="register.html">Register</a></li>
</ul>
</p>
<form id="form" class="signin">
<label for="content">Content:</label><br><textarea id="content"></textarea>
<br><br>
<input type="submit" value="Submit">
</form>
<script>
var c = document.cookie.split("; ");
var cookie = {};
for (let i=0; i<c.length; i++) cookie[c[i].split('=')[0]] = c[i].split('=')[1];

if(typeof cookie.token!="undefined"){
for(let i=0; i<document.getElementsByClassName("signout").length; i++) document.getElementsByClassName("signout")[i].style.display = "none";
}
else{
for(let i=0; i<document.getElementsByClassName("signin").length; i++) document.getElementsByClassName("signin")[i].style.display = "none";
}

document.getElementById("form").addEventListener("submit",function(e){e.preventDefault(); submit();});

async function submit(){
var e = await fetch("https://dev.maelink.net/home",{
	"headers":{"Content-Type":"application/json","Authorization":"Bearer "+cookie.token},
	"method":"POST",
	"body":JSON.stringify({"content":document.getElementById("content").value})
});
var f = await e.json();

if(f.error) {document.getElementById("err").innerText = "Failed to create post! Try again later."; return;}
else location.replace("/yorlink/");
}
</script>
</body>
</html>
